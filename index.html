// 貸切超過（30分/7.5km）
const HIRE_OT = {

  exec:   { gen: 4500, mem: 4050 },

// ESD基本料金：1h=2000円、最低4000円
const calcESD = (hours) => Math.max(4000, Math.ceil(hours) * 2000);

const fmt = (n) => n == null ? "－" : "¥" + Math.round(n).toLocaleString("ja-JP");

// ============================================================
// UI定数
// ============================================================
const CAR_OPTIONS = [

// ============================================================
const CONTRACTS = {
  // エミレーツ航空

      "複数名乗車かつ100km以上の場合：150kmまで未収、以降は現収",

  },
  // ユナイテッド航空
  "2574349-0009": {

    notes: [

// ============================================================
export default function App() {
  const [tab, setTab]       = useState("haneda");
  const [car, setCar]       = useState("luxury");
  const [member, setMember] = useState(false);
  const [lateNight, setLate]= useState(false);
  const [esd, setEsd]       = useState(false);

  // 羽田
  const [hArea, setHArea] = useState("");
  const [hOT, setHOT]     = useState(0);

  // 成田
  const [nType, setNType] = useState("送迎（通り/2H）");
  const [nOT, setNOT]     = useState(0);

  // ハイヤー
  const [hireH, setHireH]   = useState(2.0);
  const [hireKm, setHireKm] = useState("");
  const [bookStart, setBookStart] = useState("");
  const [bookEnd,   setBookEnd]   = useState("");
  const [rideStart, setRideStart] = useState("");
  const [rideEnd,   setRideEnd]   = useState("");

  // 契約
  const [contractCode, setContractCode] = useState("");
  const [contractDir,  setContractDir]  = useState("down");
  const [contractPax,  setContractPax]  = useState("1");
  const [contractKm,   setContractKm]   = useState("");
  const [contractCars, setContractCars] = useState("1");
  const [emiratesAirport, setEmiratesAirport] = useState("haneda"); // エミレーツ羽田/成田

  // 共通
  const [persons,     setPersons]     = useState("");
  const [highwayEtc,  setHighwayEtc]  = useState("");
  const [highwayCash, setHighwayCash] = useState("");
  const [meetFee,     setMeetFee]     = useState("");

  // 時刻計算
  const timeDiffH = (s, e) => {
    if (!s || !e) return null;
    const [sh, sm] = s.split(":").map(Number);
    const [eh, em] = e.split(":").map(Number);
    let diff = (eh * 60 + em) - (sh * 60 + sm);
    if (diff <= 0) diff += 24 * 60;
    return diff / 60;
  };
  const roundUpHalf = (h) => Math.ceil(h * 2) / 2;

  const bookH = timeDiffH(bookStart, bookEnd);
  const rideH = timeDiffH(rideStart, rideEnd);

  // 超過 = 実車終了が予約終了を超えた分（30分切り上げ）
  const overtimeH = (() => {
    if (!bookEnd || !rideEnd) return 0;
    const [bh, bm] = bookEnd.split(":").map(Number);
    const [rh, rm] = rideEnd.split(":").map(Number);
    let diff = (rh * 60 + rm) - (bh * 60 + bm);
    if (diff <= 0) return 0; // 予約終了前に終わった場合は超過なし
    return Math.ceil(diff / 30) * 0.5; // 30分単位切り上げ
  })();

  // 計算共通
  const mk = () => member ? "mem" : "gen";
  const applyLate = (v) => lateNight ? Math.round(v * 1.25) : v;
  const calcESD = (h) => Math.max(4000, Math.ceil(h) * 2000);

  // 羽田
  const calcHaneda = () => {
    if (!hArea) return null;
    const d = HANEDA[hArea]?.[car];
    if (!d) return null;
    let base = applyLate(d[mk()]);
    const ot = applyLate(Math.floor(hOT / 0.5) * HANEDA_OT[car][mk()]);
    const esdAmt = esd ? calcESD(1.5) : 0;
    return base + ot + esdAmt;
  };

  // 成田
  const calcNarita = () => {
    const d = NARITA[nType]?.[car];
    if (!d) return null;
    let base = d[mk()];
    if (base == null) return null;
    base = applyLate(base);
    const ot = applyLate(Math.floor(nOT / 0.5) * NARITA_OT[car][mk()]);
    const baseH = nType.includes("5H") ? 5 : nType.includes("3H") ? 3 : 2;
    const esdAmt = esd ? calcESD(baseH) : 0;
    return base + ot + esdAmt;
  };

  // ハイヤー貸切
  const calcHire = () => {
    const keyG = car === "luxury" ? "lxG" : car === "exec" ? "exG" : "ftG";
    const keyM = car === "luxury" ? "lxM" : car === "exec" ? "exM" : "ftM";
    const priceKey = member ? keyM : keyG;
    const baseH = bookH != null ? roundUpHalf(bookH) : hireH;
    const timeRow = HIRE_TABLE.find(r => r.h === baseH)
      ?? [...HIRE_TABLE].reverse().find(r => r.h <= baseH);
    const timePrice = timeRow?.[priceKey] ?? null;
    let distPrice = null;
    const km = parseFloat(hireKm);
    if (!isNaN(km) && km > 0) {
      const distRow = [...HIRE_TABLE].reverse().find(r => r.km <= km);
      if (distRow) distPrice = distRow[priceKey];
    }
    const candidates = [timePrice, distPrice].filter(v => v != null);
    if (candidates.length === 0) return null;
    let base = Math.max(...candidates);
    const otAmt = overtimeH > 0 ? Math.floor(overtimeH / 0.5) * HIRE_OT[car][mk()] : 0;
    base = applyLate(base + otAmt);
    const effectiveH = bookH != null ? roundUpHalf(bookH) : hireH;
    return base + (esd ? calcESD(effectiveH) : 0);
  };

  // 契約
  // エミレーツの実コード（羽田/成田で切替）
  const resolvedCode = contractCode === "emirates"
    ? (emiratesAirport === "haneda" ? "2507889-0001" : "2507689-0600")
    : contractCode;

  const calcContract = () => {
    const c = CONTRACTS[resolvedCode];
    if (!c) return null;
    if (c.isFlat) return contractCars === "2" ? c.fareTable.flat2 : c.fareTable.flat1;
    const km = parseFloat(contractKm);
    const ft = c.fareTable;
    const dir = contractDir;
    const isMulti = contractPax === "2+";
    if (isNaN(km) || km <= 0) return null;
    let base;
    if (!isMulti) {
      base = dir === "up" ? ft.up.base1 : ft.down.base1;
    } else {
      if (km <= ft[dir].limitKm1) base = dir === "up" ? ft.up.base2 : ft.down.base2;
      else base = dir === "up" ? ft.up.ext2 : ft.down.ext2;
    }
    let overKm = 0;
    if (!isMulti && km > ft[dir].limitKm1) overKm = km - ft[dir].limitKm1;
    else if (isMulti && km > ft[dir].limitKm2) overKm = km - ft[dir].limitKm2;
    return base + (overKm > 0 ? Math.ceil(overKm) * ft.overKmRate : 0);
  };

  const contractPaymentNote = (() => {
    const c = CONTRACTS[resolvedCode];
    if (!c || c.isFlat) return null;
    const km = parseFloat(contractKm);
    if (isNaN(km)) return null;
    const ft = c.fareTable;
    const isMulti = contractPax === "2+";
    const limit = isMulti ? ft[contractDir].limitKm2 : ft[contractDir].limitKm1;
    return km <= limit ? { type: "未収", ok: true } : { type: "現収", ok: false };
  })();

  const fareResult =
    tab === "haneda"   ? calcHaneda() :
    tab === "narita"   ? calcNarita() :
    tab === "hire"     ? calcHire()   :
    calcContract();

  // 合計
  const etc  = parseFloat(highwayEtc)  || 0;
  const cash = parseFloat(highwayCash) || 0;
  const meet = parseFloat(meetFee)     || 0;
  const total = fareResult != null ? fareResult + etc + cash + meet : null;

  // ハイヤー適用根拠
  const hireInfo = (() => {
    if (tab !== "hire") return null;
    const keyG = car === "luxury" ? "lxG" : car === "exec" ? "exG" : "ftG";
    const keyM = car === "luxury" ? "lxM" : car === "exec" ? "exM" : "ftM";
    const priceKey = member ? keyM : keyG;
    const baseH = bookH != null ? roundUpHalf(bookH) : hireH;
    const timeRow = HIRE_TABLE.find(r => r.h === baseH) ?? [...HIRE_TABLE].reverse().find(r => r.h <= baseH);
    const tp = timeRow?.[priceKey] ?? null;
    const km = parseFloat(hireKm);
    let dp = null;
    if (!isNaN(km) && km > 0) {
      const dr = [...HIRE_TABLE].reverse().find(r => r.km <= km);
      if (dr) dp = dr[priceKey];
    }
    return { tp, dp, adopted: (tp ?? 0) >= (dp ?? 0) ? "時間制" : "距離制" };
  })();

  return (
    <div style={s.root}>
      {/* ヘッダー */}
      <div style={s.header}>
        <div style={s.logo}>MK</div>
        <div>

function RulesTab() {
  const [openCat, setOpenCat] = useState(null);
  const [search, setSearch] = useState("");

  const filtered = RULES.map(cat => ({
    ...cat,
    items: cat.items.filter(item =>
      !search || item.title.includes(search) || item.body.includes(search) || cat.cat.includes(search)
    ),
  })).filter(cat => cat.items.length > 0);

  return (
    <div style={{ padding: "12px 0" }}>
      {/* 検索 */}
      <div style={ruleS.searchBox}>
        <span style={ruleS.searchIcon}>🔍</span>
        <input
          type="text"
          placeholder="キーワードで検索..."
          value={search}
          onChange={e => setSearch(e.target.value)}
          style={ruleS.searchInput}
        />
        {search && (
          <button onClick={() => setSearch("")} style={ruleS.clearBtn}>✕</button>
        )}
      </div>

      {filtered.length === 0 && (
        <div style={{ textAlign: "center", color: C.muted, fontSize: 13, padding: "24px 0" }}>
          該当するルールが見つかりません
        </div>
      )}

      {filtered.map(cat => (
        <div key={cat.cat} style={ruleS.catBlock}>
          <button
            style={ruleS.catHeader}
            onClick={() => setOpenCat(openCat === cat.cat ? null : cat.cat)}>
            <span style={ruleS.catIcon}>{cat.icon}</span>
            <span style={ruleS.catName}>{cat.cat}</span>
            <span style={ruleS.catChevron}>{openCat === cat.cat || search ? "▲" : "▼"}</span>
          </button>

          {(openCat === cat.cat || search) && (
            <div style={ruleS.itemList}>
              {cat.items.map((item, i) => (
                <div key={i} style={ruleS.item}>
                  <div style={ruleS.itemTitle}>{item.title}</div>
                  <div style={ruleS.itemBody}>{item.body.split("\n").map((line, j) => (
                    <div key={j}>{line}</div>
                  ))}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}


// ---- サブコンポーネント ----
function Label({ children }) {
  return <div style={sc.label}>{children}</div>;
}

function Row({ children }) {
  return <div style={{ display: "flex", alignItems: "center", gap: 6 }}>{children}</div>;
}

function Seg({ options, val, set, small, block }) {
  return (
    <div style={{ display: "flex", gap: 5, flexWrap: block ? "wrap" : "nowrap" }}>
      {options.map(o => (
        <button key={String(o.k)}
          style={{
            ...sc.seg,
            ...(String(val) === String(o.k) ? sc.segOn : {}),
            fontSize: small ? 11 : 12,
            padding: small ? "5px 10px" : "6px 12px",
          }}
          onClick={() => set(o.k)}>
          {o.v}
        </button>
      ))}
    </div>
  );
}

function Toggle({ val, set, label }) {
  return (
    <div style={sc.toggleRow} onClick={() => set(!val)}>
      <div style={{ ...sc.track, ...(val ? sc.trackOn : {}) }}>
        <div style={{ ...sc.thumb, ...(val ? sc.thumbOn : {}) }} />
      </div>
      <span style={sc.toggleLabel}>{label}</span>
    </div>
  );
}

function BdRow({ label, val, sub, accent }) {
  return (
    <div style={sc.bdRow}>
      <div>
        <span style={sc.bdLabel}>{label}</span>
        {sub && <div style={sc.bdSub}>{sub}</div>}
      </div>
      <span style={{ ...sc.bdVal, ...(accent ? { color: "#e07040" } : {}) }}>{val}</span>
    </div>
  );
}
